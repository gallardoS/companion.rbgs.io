[package]
name = "rbgs-companion"
version = "0.0.1"
description = "Windows companion for rbgs.io"
authors = ["rbgs.io"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "rbgs_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["tray-icon"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37.0", features = ["bundled"] }
sha2 = "0.10.9"
getrandom = "0.3.4"
tokio = { version = "1", features = ["sync", "time"] }
keyring = { version = "3.6.3", features = ["windows-native"] }
tauri-plugin-dialog = "2.8.2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "=2.7.0"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"
